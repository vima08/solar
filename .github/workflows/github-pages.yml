name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /solar

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --omit=dev

      - name: Prepare site
        run: |
          mkdir -p _site/node_modules
          cp index.html styles.css favicon.svg manifest.webmanifest service-worker.js _site/
          cp -R js _site/js
          cp -R node_modules/three _site/node_modules/three
          sed -i "/<head>/a\\    <base href=\"${BASE_PATH}/\" />" _site/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
